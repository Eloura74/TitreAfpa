name: CI/CD Pipeline - Tests & Deploy

on:
  push:
    branches: [ main, develop, securite ]
  pull_request:
    branches: [ main ]

jobs:
  # ===================================
  # BACKEND : TESTS & LINT
  # ===================================
  backend-test:
    name: 🖥️ Backend Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔍 Run linter
        run: npm run lint || echo "Linter warnings only"
      
      - name: 🧪 Run tests
        run: npm test
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/test
          JWT_SECRET: test_secret_for_github_actions_ci_only
      
      - name: 📊 Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          directory: backend/coverage
          flags: backend
          name: backend-coverage

  # ===================================
  # FRONTEND : TESTS, LINT & BUILD
  # ===================================
  frontend-test:
    name: 💻 Frontend Tests & Build
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: photographie
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: photographie/package-lock.json
      
      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: 🔍 Run linter
        run: npm run lint
      
      - name: 🧪 Run tests
        run: npm test -- --run
      
      - name: 🏗️ Build production
        run: npm run build
        env:
          VITE_API_URL: https://placeholder-backend.vercel.app
          VITE_PAYPAL_CLIENT_ID: placeholder
      
      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: photographie/dist
          retention-days: 7

  # ===================================
  # LIGHTHOUSE : PERFORMANCE AUDIT
  # ===================================
  lighthouse:
    name: 🔍 Lighthouse Performance Audit
    needs: frontend-test
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: photographie/dist
      
      - name: 🚀 Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3000
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3

  # ===================================
  # SÉCURITÉ : AUDIT DEPENDENCIES
  # ===================================
  security-audit:
    name: 🔐 Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: 🔍 Backend Security Audit
        run: |
          cd backend
          npm audit --audit-level=moderate || true
      
      - name: 🔍 Frontend Security Audit
        run: |
          cd photographie
          npm audit --audit-level=moderate || true

  # ===================================
  # DEPLOY : VERCEL PRODUCTION
  # ===================================
  deploy-production:
    name: 🚀 Deploy to Vercel Production
    needs: [backend-test, frontend-test, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🚀 Deploy Backend to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: backend
      
      - name: 🚀 Deploy Frontend to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: photographie
      
      - name: ✅ Deployment Success Notification
        run: |
          echo "🎉 Déploiement réussi sur Vercel Production !"
          echo "Backend: https://votre-backend.vercel.app"
          echo "Frontend: https://titre-afpa.vercel.app"

  # ===================================
  # DEPLOY : VERCEL PREVIEW (PR)
  # ===================================
  deploy-preview:
    name: 🔍 Deploy Preview (PR)
    needs: [backend-test, frontend-test]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🚀 Deploy Preview to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          working-directory: photographie
      
      - name: 💬 Comment PR with Preview URL
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Preview deployment ready!\n\nVisit: https://preview-url.vercel.app'
            })
