<!DOCTYPE html>
<html lang="fr">
  <head>
    <!-- ============================================ -->
    <!-- CONFIGURATION DE BASE -->
    <!-- ============================================ -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Content-Language" content="fr" />
    
    <!-- ============================================ -->
    <!-- SEO - TITRE ET DESCRIPTION -->
    <!-- ============================================ -->
    <title>Fabien Licata | Photographe Professionnel & Graphiste | Portfolio & Tirages d'Art</title>
    <meta
      name="description"
      content="Découvrez le portfolio de Fabien Licata, photographe professionnel et graphiste. Spécialisé en mariages, événements, portraits et créations graphiques. Tirages d'art disponibles sur papier, toile et aluminium. Prestations photo sur-mesure."
    />
    <meta
      name="keywords"
      content="photographe, graphiste, portfolio, tirages art, mariage, événements, portrait, photographie professionnelle, design graphique, Fabien Licata"
    />
    <meta name="author" content="Fabien Licata" />
    
    <!-- ============================================ -->
    <!-- SEO - CANONICAL ET ROBOTS -->
    <!-- ============================================ -->
    <link rel="canonical" href="https://titre-afpa.vercel.app" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="HandheldFriendly" content="true" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    
    <!-- ============================================ -->
    <!-- OPEN GRAPH (Facebook, LinkedIn) -->
    <!-- ============================================ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fabien Licata | Photographe & Graphiste" />
    <meta property="og:title" content="Fabien Licata | Photographe Professionnel & Graphiste" />
    <meta
      property="og:description"
      content="Portfolio professionnel de Fabien Licata. Photographie d'art, mariages, événements et créations graphiques sur-mesure."
    />
    <meta property="og:url" content="https://titre-afpa.vercel.app" />
    <meta property="og:image" content="https://titre-afpa.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Portfolio Fabien Licata - Photographe & Graphiste" />
    <meta property="og:locale" content="fr_FR" />
    
    <!-- ============================================ -->
    <!-- TWITTER CARD -->
    <!-- ============================================ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fabien Licata | Photographe & Graphiste" />
    <meta
      name="twitter:description"
      content="Portfolio professionnel de Fabien Licata. Photographie d'art et créations graphiques."
    />
    <meta name="twitter:image" content="https://titre-afpa.vercel.app/og-image.jpg" />
    <meta name="twitter:image:alt" content="Portfolio Fabien Licata" />
    
    <!-- ============================================ -->
    <!-- FAVICON ET ICÔNES -->
    <!-- ============================================ -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- ============================================ -->
    <!-- OPTIMISATIONS PERFORMANCE - DNS PRECONNECT -->
    <!-- ============================================ -->
    <!-- Preconnect vers Cloudinary (images) - Économise ~300ms TTFB -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    
    <!-- Preconnect vers API backend (Vercel) -->
    <link rel="preconnect" href="https://titre-afpa.vercel.app" />
    <link rel="dns-prefetch" href="https://titre-afpa.vercel.app" />
    
    <!-- Preconnect vers PayPal (paiements) -->
    <link rel="preconnect" href="https://www.paypal.com" />
    <link rel="dns-prefetch" href="https://www.paypal.com" />
    
    <!-- ============================================ -->
    <!-- POLICES - PRÉCHARGEMENT POUR PERFORMANCE -->
    <!-- ============================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    
    <!-- ============================================ -->
    <!-- THÈME ET COULEUR -->
    <!-- ============================================ -->
    <meta name="theme-color" content="#0a0a10" />
    <meta name="msapplication-TileColor" content="#0a0a10" />
    
    <!-- ============================================ -->
    <!-- SCHEMA.ORG - DONNÉES STRUCTURÉES -->
    <!-- ============================================ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "@id": "https://titre-afpa.vercel.app",
      "name": "Fabien Licata Photographie & Graphisme",
      "description": "Photographe professionnel et graphiste spécialisé en mariages, événements et créations artistiques",
      "url": "https://titre-afpa.vercel.app",
      "logo": "https://titre-afpa.vercel.app/images/logoHome.png",
      "image": "https://titre-afpa.vercel.app/og-image.jpg",
      "telephone": "+33-X-XX-XX-XX-XX",
      "email": "faber.quentin@gmail.com",
      "priceRange": "€€",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "FR",
        "addressLocality": "Ville",
        "addressRegion": "Région"
      },
      "sameAs": [
        "https://www.facebook.com/fabienlicata",
        "https://www.instagram.com/fabienlicata"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Services Photographiques",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Photographie de Mariage",
              "description": "Couverture complète de votre mariage"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Portraits Professionnels",
              "description": "Séances photo portrait en studio ou extérieur"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Product",
              "name": "Tirages d'Art",
              "description": "Tirages photographiques sur différents supports"
            }
          }
        ]
      }
    }
    </script>
  </head>
  <body>
    <!-- ============================================ -->
    <!-- APPLICATION REACT -->
    <!-- ============================================ -->
    <div id="root"></div>
    
    <!-- Chargement du script principal -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Message pour navigateurs sans JavaScript -->
    <noscript>
      <div style="text-align: center; padding: 50px; font-family: sans-serif;">
        <h1>JavaScript requis</h1>
        <p>Ce site nécessite JavaScript pour fonctionner correctement.</p>
        <p>Veuillez activer JavaScript dans votre navigateur.</p>
      </div>
    </noscript>
  </body>
</html>
